<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI CRM - Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="register-container">
        <div class="register-card">
            <header class="register-header">
                <h2>Crear nueva cuenta</h2>

                <p>Completar para registrarse</p>
            </header>

            <!--   FORMULARIO EN GRID DE 2 COLUMNAS  -->
            <form action="#" method="post" class="register-form">
                
                <!-- NOMBRE COMPLETO -->
                <div class="form-group full-width">
                    <label for="reg-name">Nombre Completo</label>
                    <input type="text" id="reg-name" name="name" required placeholder="Miguel lopez">
                </div>

                <!-- CORREO ELECTRONICO -->
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" name="email" 
                           required 
                           pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" 
                           placeholder="ejemplo@correo.com">
                </div>

                <!-- TELEFONO (11 DIGITOS) -->
                <div class="form-group">
                    <label for="reg-phone">Teléfono</label>
                    <input type="tel" id="reg-phone" name="phone" 
                           required 
                           pattern="[0-9]{11}" 
                           placeholder="11 dígitos (ej. 04126543786)">
                </div>


                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" name="password" 
                           required 
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                           placeholder="Minimo 8 caracteres">
                </div>


                <div class="form-group">
                    <label for="reg-confirm">Confirmar Contraseña</label>
                    <input type="password" id="reg-confirm" name="confirm_password" 
                           required 
                           minlength="8" 
                           placeholder="Repite tu contraseña">
                </div>

                <!-- TERMINOS Y CONDICIONES -->
                <div class="form-group checkbox full-width">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">Acepta los términos y condiciones</label>
                </div>

                <!-- BOTON -->
                <div class="form-group full-width">
                    <button type="submit" class="btn-primary">Registrarse</button>
                </div>
            </form>

            <footer>
                <a href="login_base.html">¿Ya tienes cuenta? Iniciar Sesion</a>
            </footer>
        </div>
    </section>
</body>
</html>
